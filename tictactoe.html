
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe</title>
<style>
body {
  margin: 0;
  background: #101326;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 25px 12px;
}
h1 { color: #ffd54a; }
#status {
  font-size: 23px;
  margin: 25px;
  color: #ffd54a;
}
.board {
  display: grid;
  grid-template-columns: repeat(3, 95px);
  gap: 10px;
  justify-content: center;
}
.cell {
  width: 95px;
  height: 95px;
  background: #252c4b;
  border: 2px solid #536080;
  border-radius: 15px;
  color: #ffd54a;
  font-size: 45px;
  font-weight: bold;
}
button { cursor: pointer; }
.controls button {
  margin: 20px 5px;
  padding: 13px 22px;
  border: 0;
  border-radius: 25px;
  background: #ffd54a;
  font-size: 16px;
  font-weight: bold;
}
.home {
  display: inline-block;
  color: white;
  margin-top: 20px;
}
</style>
</head>
<body>

<h1>⭕ TIC TAC TOE ❌</h1>
<p>Two Player Game</p>

<div id="status">Player X's Turn</div>

<div class="board" id="board"></div>

<div class="controls">
<button onclick="restart()">🔄 Restart</button>
</div>

<h3 id="score">X: 0 | O: 0</h3>

<a class="home" href="index.html">🏠 Back to Spin Master</a>

<script>
let current = "X";
let cells = Array(9).fill("");
let finished = false;
let scores = {X:0, O:0};

const wins = [
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
];

const board = document.getElementById("board");

function render() {
  board.innerHTML = "";
  cells.forEach((value, i) => {
    const button = document.createElement("button");
    button.className = "cell";
    button.textContent = value;
    button.onclick = () => play(i);
    board.appendChild(button);
  });
}

function play(i) {
  if(finished || cells[i]) return;

  cells[i] = current;
  render();

  const won = wins.some(line =>
    line.every(index => cells[index] === current)
  );

  if(won) {
    finished = true;
    scores[current]++;
    document.getElementById("status").textContent =
      "🏆 Player " + current + " Wins!";
    updateScore();
    return;
  }

  if(cells.every(Boolean)) {
    finished = true;
    document.getElementById("status").textContent =
      "🤝 Match Draw!";
    return;
  }

  current = current === "X" ? "O" : "X";
  document.getElementById("status").textContent =
    "Player " + current + "'s Turn";
}

function updateScore() {
  document.getElementById("score").textContent =
    "X: " + scores.X + " | O: " + scores.O;
}

function restart() {
  cells = Array(9).fill("");
  current = "X";
  finished = false;
  document.getElementById("status").textContent =
    "Player X's Turn";
  render();
}

render();
</script>
</body>
  </html>
